<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="devcommons is a global community for developers, creators and technology enthusiasts to share knowledge and build meaningful projects."
    />
    <title>devcommons — Build connections. Create together.</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('devcommons-theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = mode === 'dark' || ((mode === null || mode === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          void error;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
