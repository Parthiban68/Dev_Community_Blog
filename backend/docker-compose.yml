services:
  postgres:
    image: postgres:17-alpine
    container_name: devcommunity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-devcommunity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devcommunity} -d ${POSTGRES_DB:-devcommunity}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
